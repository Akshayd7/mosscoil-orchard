<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mosscoil Orchard</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:radial-gradient(ellipse at 50% 38%,#345846 0,#203e39 52%,#142a2b 100%);color:#f8e9c8;font-family:monospace;overscroll-behavior:none;touch-action:manipulation}main{position:fixed;inset:0;min-height:100dvh;overflow:hidden}.board{position:absolute;left:50%;top:50%;width:min(100vw,100dvh);height:min(100vw,100dvh);transform:translate(-50%,-50%);border:6px solid #b48653;box-shadow:0 0 0 3px #4a6250,0 0 42px #091c1c99;background:#233c37}.board:before,.board:after{content:"";position:absolute;z-index:2;left:0;right:0;height:5px;pointer-events:none;background:linear-gradient(90deg,#142e2e,#3e6542,#76924e,#3e6542,#142e2e);opacity:.75}.board:before{top:0}.board:after{bottom:0}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}.top{position:absolute;z-index:4;top:max(10px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"brand brand brand" "score pause mute";align-items:center;gap:8px}.brand{grid-area:brand}.score{grid-area:score;justify-self:start}.top #pause{grid-area:pause;justify-self:center}.top #mute{grid-area:mute;justify-self:end}.brand{font-weight:900;color:#f0d47e;text-shadow:2px 2px #102724;font-size:clamp(15px,4.8vw,21px);letter-spacing:1px}.score{font-weight:800;font-size:13px;background:#142a2bea;border:1px solid #b48653;border-radius:8px;padding:10px 11px;white-space:nowrap}.button{font:700 14px monospace;background:#edcc80;color:#213a34;border:0;border-bottom:4px solid #b78c4b;padding:10px 12px;min-height:46px;min-width:54px;cursor:pointer;border-radius:8px;touch-action:manipulation}.button:focus-visible{outline:3px solid #fff}.button:active{transform:translateY(2px);border-bottom-width:2px}.pad{position:absolute;z-index:4;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 30px);transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,minmax(68px,82px));grid-template-rows:56px 56px;gap:7px}.pad button{font:900 23px monospace;background:#edcc80ed;color:#213a34;border:0;border-bottom:4px solid #b78c4b;border-radius:12px;min-height:56px;touch-action:manipulation}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}.hint{position:absolute;z-index:4;left:8px;right:8px;bottom:max(5px,env(safe-area-inset-bottom));text-align:center;color:#e1ddbd;font-size:10px;text-shadow:1px 1px #102724;pointer-events:none}.overlay{z-index:3;position:absolute;inset:0;background:#132923c9;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}.overlay[hidden]{display:none}.card{max-width:330px;padding:24px 20px;background:#1d3934ed;border:2px solid #b48653;box-shadow:0 6px 0 #102724,inset 0 0 0 5px #e9cb7622;border-radius:14px}.overlay h2{text-shadow:3px 3px #071b21;letter-spacing:2px;font-size:clamp(24px,7vw,32px);margin:0 0 8px;color:#ffe08c}.overlay p{max-width:290px;font-size:14px;line-height:1.5;margin:10px auto 16px}.footer{display:none}@media(max-height:650px){.pad{grid-template-rows:48px 48px;bottom:calc(max(5px,env(safe-area-inset-bottom)) + 24px)}.pad button{min-height:48px}.hint{font-size:9px}.top{top:max(5px,env(safe-area-inset-top))}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style><main><div class="board"><canvas id="game" width="288" height="288" aria-label="Snake game orchard. Use the direction buttons below or swipe to steer." role="img"></canvas><div id="overlay" class="overlay"><div class="card"><h2 id="headline">Meet Pip</h2><p id="message">A curious moss serpent with a leafy tail. Cross any edge to appear on the opposite side. Avoid your own coils.</p><button class="button" id="start">Start orchard</button></div></div></div><header class="top"><div class="brand">MOSSCOIL ORCHARD</div><strong class="score" id="score">Berries 0 / 12</strong><button class="button" id="pause" aria-label="Pause game">Pause</button><button class="button" id="mute" aria-label="Mute music">Sound on</button></header><div class="pad" aria-label="Direction controls"><button class="up" data-dir="up" aria-label="Move up">▲</button><button class="left" data-dir="left" aria-label="Move left">◀</button><button class="down" data-dir="down" aria-label="Move down">▼</button><button class="right" data-dir="right" aria-label="Move right">▶</button></div><div class="hint">Tap arrows or swipe • Eat 12 glowberries • Space pauses</div></main><script>
'use strict';
const C=document.getElementById('game'),ctx=C.getContext('2d'),N=18,T=16,GOAL=12;let dpr=1,unit=1;function resizeCanvas(){const r=C.getBoundingClientRect();dpr=Math.min(3,window.devicePixelRatio||1);unit=r.width/288;C.width=Math.max(1,Math.round(r.width*dpr));C.height=Math.max(1,Math.round(r.height*dpr));ctx.setTransform(unit*dpr,0,0,unit*dpr,0,0)}window.addEventListener('resize',resizeCanvas,{passive:true});
const ui={score:document.getElementById('score'),overlay:document.getElementById('overlay'),head:document.getElementById('headline'),message:document.getElementById('message'),start:document.getElementById('start'),pause:document.getElementById('pause'),mute:document.getElementById('mute')};
const dirs={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};let body,dir,next,food,points=0,state='ready',turnLocked=false,last=0,acc=0,particles=[],muted=false,audio=null,gain=null,musicTimer=null,musicBeat=0;
function reset(){body=[{x:8,y:9},{x:7,y:9},{x:6,y:9}];dir={...dirs.right};next={...dir};points=0;particles=[];acc=0;turnLocked=false;spawn();ui.score.textContent='Berries 0 / 12'}
function spawn(){const empty=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!body.some(v=>v.x===x&&v.y===y))empty.push({x,y});food=empty[Math.floor(Math.random()*empty.length)]}
function setDir(name){if(state!=='playing'||turnLocked)return;const v=dirs[name];if(!v||v.x===-dir.x&&v.y===-dir.y)return;next={...v};turnLocked=true;tone(290,.045,.018,'triangle')}
function panel(h,m,b){ui.overlay.hidden=false;ui.head.textContent=h;ui.message.textContent=m;ui.start.textContent=b}
function begin(){reset();state='playing';ui.overlay.hidden=true;ui.pause.textContent='Pause';last=performance.now();soundStart();draw(0)}
function finish(won){state=won?'won':'lost';panel(won?'Orchard saved!':'Ouch, a tangled coil!',won?'Pip collected all 12 sunberries. A well-fed serpent is a happy serpent.':`You collected ${points} berries. Keep a little room for your tail.`, 'Retry orchard');[0,1,2,3].forEach(j=>tone(won?[523,659,784,1047][j]:[220,175,147,98][j],.22,.055,'triangle',j*.11))}
function pause(){if(state==='playing'){state='paused';panel('Taking a breather','Your orchard is paused.','Resume');ui.pause.textContent='Resume'}else if(state==='paused'){state='playing';ui.overlay.hidden=true;last=performance.now();acc=0;ui.pause.textContent='Pause';soundStart()}}
function step(){if(state!=='playing')return;dir={...next};turnLocked=false;const h={x:(body[0].x+dir.x+N)%N,y:(body[0].y+dir.y+N)%N};const eating=h.x===food.x&&h.y===food.y;const collisionBody=eating?body:body.slice(0,-1);if(collisionBody.some(v=>v.x===h.x&&v.y===h.y)){finish(false);return}body.unshift(h);if(eating){points++;ui.score.textContent=`Berries ${points} / ${GOAL}`;tone(880,.10,.045,'square');tone(1320,.15,.035,'triangle',.07);for(let j=0;j<10;j++)particles.push({x:(h.x+.5)*T,y:(h.y+.5)*T,vx:(Math.random()-.5)*65,vy:(Math.random()-.5)*65,life:.45});if(points>=GOAL){finish(true);return}spawn()}else body.pop()}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function draw(time){
ctx.setTransform(unit*dpr,0,0,unit*dpr,0,0);ctx.fillStyle='#203d36';ctx.fillRect(0,0,288,288);
for(let y=0;y<N;y++)for(let x=0;x<N;x++){const v=(x*17+y*31)%11;rect(x*T,y*T,T,T,(x+y)%2?'#2d503b':'#294936');if(v<4){rect(x*T+2,y*T+11,2,3,'#4b6c43');rect(x*T+4,y*T+9,2,5,'#5a7d48')}if(v===6){rect(x*T+10,y*T+4,3,2,'#49604b');rect(x*T+11,y*T+3,2,1,'#657551')}if(v===8){rect(x*T+3,y*T+4,2,2,'#b5876b');rect(x*T+4,y*T+5,2,2,'#d7b77c')}}
// Decorative canopy stays outside the traversable grid; no gameplay obstacles.
for(let i=0;i<9;i++){let xx=i*34+Math.round(Math.sin(time*.0007+i));rect(xx,0,23,3,'#142e2e');rect(xx+5,2,14,3,'#3e6542');rect(xx+12,3,6,2,'#76924e');rect(xx,285,22,3,'#163832')}
for(let j=0;j<8;j++){let xx=(j*43+time*.004)%288,yy=(j*67+Math.sin(time*.001+j)*8)%288;rect(xx,yy,2,2,Math.sin(time*.003+j)>0?'#e7d580':'#6e9561')}
const f=food,bob=state==='playing'?Math.round(Math.sin(time*.007)):0,fx=f.x*T,fy=f.y*T+bob;
rect(fx+4,fy+13,9,2,'#172f2d');rect(fx+4,fy+5,10,7,'#a65438');rect(fx+3,fy+4,10,7,'#ed9747');rect(fx+5,fy+3,7,8,'#ffc969');rect(fx+5,fy+4,3,2,'#fff0a7');rect(fx+8,fy,2,4,'#9bc978');rect(fx+10,fy+1,4,2,'#608f4c');if(Math.sin(time*.008)>0){rect(fx+1,fy+1,1,4,'#fff3b1');rect(fx,fy+2,3,1,'#fff3b1')}
body.slice().reverse().forEach((v,j)=>{const idx=body.length-j-1,px=v.x*T,py=v.y*T;rect(px+2,py+12,13,3,'#152f2d');rect(px+1,py+3,14,10,'#4c8054');rect(px+1,py+1,13,10,idx===0?'#d2e58b':'#8cbf65');rect(px+3,py+2,6,3,'#e2eca1');rect(px+3,py+10,9,2,'#619749');if(idx>0){rect(px+10,py+5,3,3,'#5a914e');rect(px+4,py+7,2,2,'#b7d480')}});
const h=body[0],hx=h.x*T,hy=h.y*T,blink=Math.floor(time/170)%23===0;
if(dir.x){const ex=hx+(dir.x>0?10:2);rect(ex,hy+3,3,blink?1:3,'#142d2d');rect(ex,hy+8,3,blink?1:3,'#142d2d');if(!blink)rect(ex,hy+3,1,1,'#fff');if(state==='playing'&&Math.floor(time/180)%8===0)rect(hx+(dir.x>0?14:-3),hy+7,4,1,'#dc9c86')}
else{const ey=hy+(dir.y>0?10:2);rect(hx+3,ey,3,blink?1:3,'#142d2d');rect(hx+9,ey,3,blink?1:3,'#142d2d')}
const tail=body[body.length-1],sway=Math.floor(time/240)%2;rect(tail.x*T+4,tail.y*T-1,3,5,'#c7dd80');rect(tail.x*T+7+sway,tail.y*T-3,4,5,'#79ae56');rect(tail.x*T+10+sway,tail.y*T-1,2,3,'#accb6b');particles.forEach(p=>{rect(p.x,p.y,3,3,'#ffdc70');rect(p.x+2,p.y-2,1,1,'#fff2b4')});
}
function frame(t){const dt=Math.min((t-last)/1000,.1);last=t;if(state==='playing'){acc+=dt*1000;const speed=Math.max(115,210-points*7);if(acc>=speed){acc-=speed;step()}particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0)}draw(t);requestAnimationFrame(frame)}
function tone(freq,duration=.16,vol=.03,type='square',when=0){if(!audio||muted)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;o.connect(g);g.connect(gain);let at=audio.currentTime+when;g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(vol,at+.006);g.gain.exponentialRampToValueAtTime(.0001,at+duration);o.start(at);o.stop(at+duration+.02)}
function drum(kind){if(!audio||muted)return;const n=audio.createBuffer(1,audio.sampleRate*.12,audio.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,kind==='hat'?6:2);const src=audio.createBufferSource(),g=audio.createGain(),f=audio.createBiquadFilter();src.buffer=n;f.type='highpass';f.frequency.value=kind==='hat'?6500:1400;g.gain.value=kind==='hat'?.014:.032;src.connect(f);f.connect(g);g.connect(gain);src.start()}
function soundStart(){if(!audio){try{audio=new(window.AudioContext||window.webkitAudioContext)();gain=audio.createGain();gain.gain.value=.65;gain.connect(audio.destination)}catch(e){ui.mute.textContent='Audio unavailable';return}}audio.resume();if(!musicTimer)musicTimer=setInterval(()=>{if(state!=='playing'||muted||audio.state!=='running')return;const melody=[76,0,79,81,79,76,74,0,72,74,76,79,76,74,71,0,74,0,78,81,78,74,72,0,71,72,74,78,74,71,69,0], roots=[48,45,53,55],k=musicBeat%32,n=melody[k],root=roots[Math.floor(k/8)];if(n)tone(440*2**((n-69)/12),.18,.028,'square');if(k%2===0)tone(440*2**(((k%4===0?root:root+12)-69)/12),.24,.045,'triangle');if(k%4===0){tone(72,.12,.07,'sine');tone(45,.17,.04,'sine')}if(k%4===2)drum('snare');drum('hat');if(k%4===1)tone(440*2**((root+19-69)/12),.11,.012,'triangle');musicBeat++;},150)}
ui.start.onclick=()=>state==='paused'?pause():begin();ui.pause.onclick=pause;ui.mute.onclick=()=>{muted=!muted;ui.mute.textContent=muted?'Sound off':'Sound on';ui.mute.setAttribute('aria-label',muted?'Unmute music':'Mute music');if(gain)gain.gain.value=muted?0:.65;if(!muted&&state==='playing')soundStart()};document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();setDir(b.dataset.dir)}));
addEventListener('keydown',e=>{const map={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};if(map[e.key]){e.preventDefault();setDir(map[e.key])}if(e.code==='Space'){e.preventDefault();pause()}});
let touch=null;C.addEventListener('pointerdown',e=>{touch={x:e.clientX,y:e.clientY};if(C.hasPointerCapture(e.pointerId)===false){try{C.setPointerCapture(e.pointerId)}catch(_){}}});C.addEventListener('pointerup',e=>{if(!touch)return;const dx=e.clientX-touch.x,dy=e.clientY-touch.y;touch=null;if(Math.max(Math.abs(dx),Math.abs(dy))<15)return;setDir(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')});C.addEventListener('pointercancel',()=>touch=null);document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()});resizeCanvas();reset();requestAnimationFrame(frame);
</script></html>
